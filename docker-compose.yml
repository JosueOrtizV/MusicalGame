services:
  server:
    container_name: musicalgame-server-1
    build:
      context: .
      dockerfile: musical-blocks-server/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://voxelrave.com}
    expose:
      - "3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
      - /dev/shm:noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voxelrave_net
      - web

  client:
    container_name: musicalgame-client-1
    build:
      context: .
      dockerfile: musical-blocks-client/Dockerfile
      args:
        - NEXT_PUBLIC_SERVER_URL=https://api.voxelrave.com
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - musical-blocks-client/.env.local
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_SERVER_URL=https://api.voxelrave.com
    expose:
      - "3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/tmp:noexec,nosuid,nodev
      - /dev/shm:noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - voxelrave_net
      - web

networks:
  voxelrave_net:
    driver: bridge
  web:
    external: true
