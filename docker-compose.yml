version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: musical-blocks-server/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      # Caddy will proxy traffic to this instance.
      # The CLIENT_ORIGIN is the public URL of the frontend (e.g., https://voxelrave.com).
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://voxelrave.com}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Ensure network matches if caddy runs here
    networks:
      - voxelrave_net

  client:
    build:
      context: .
      dockerfile: musical-blocks-client/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Important: Inform the client where to connect to the backend over WSS
      - NEXT_PUBLIC_SOCKET_URL=wss://api.voxelrave.com
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - voxelrave_net

  # Optional Caddy Reverse Proxy for automatic HTTPS
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - voxelrave_net
    depends_on:
      - server
      - client

networks:
  voxelrave_net:

volumes:
  caddy_data:
  caddy_config:
