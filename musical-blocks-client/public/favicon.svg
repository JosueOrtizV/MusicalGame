<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#180b30"/>
      <stop offset="100%" stop-color="#0b0416"/>
    </radialGradient>

    <!-- Gradientes Neón -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <linearGradient id="magentaNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00ea"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>

    <!-- Filtro de resplandor (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Cubo Neón Principal -->
  <g filter="url(#neonGlow)" transform="translate(256, 256)">
    <!-- Cara Superior -->
    <polygon points="0,-160 140,-80 0,0 -140,-80" fill="none" stroke="url(#cyanNeon)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Patrón Cara Superior -->
    <polygon points="0,-110 80,-64 0,-18 -80,-64" fill="none" stroke="url(#magentaNeon)" stroke-width="8"/>
    <circle cx="0" cy="-64" r="10" fill="#00f6ff"/>

    <!-- Cara Izquierda -->
    <polygon points="-140,-80 0,0 0,160 -140,80" fill="none" stroke="url(#magentaNeon)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Patrón Cara Izquierda -->
    <path d="M-100,-40 L-40,-6 L-40,100 L-100,66 Z" fill="none" stroke="url(#cyanNeon)" stroke-width="8"/>
    <circle cx="-70" cy="30" r="10" fill="#ff00ea"/>

    <!-- Cara Derecha -->
    <polygon points="0,0 140,-80 140,80 0,160" fill="none" stroke="url(#cyanNeon)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Patrón Cara Derecha -->
    <path d="M40,-6 L100,-40 L100,66 L40,100 Z" fill="none" stroke="url(#magentaNeon)" stroke-width="8"/>
    <circle cx="70" cy="30" r="10" fill="#00f6ff"/>

    <!-- Eje Central Interiores -->
    <line x1="0" y1="0" x2="0" y2="160" stroke="url(#cyanNeon)" stroke-width="12"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
  </g>
</svg>
